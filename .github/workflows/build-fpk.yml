name: Build fpk

# 在仓库的 Actions 页面点 "Run workflow" 即可生成 .fpk 安装包，
# 构建产物在 workflow 运行页面的 Artifacts 中下载，Release 里同时挂 fpk 和 TV APK。
# 说明：KTV 镜像推送到 ghcr.io/aeson70/ktv-home:latest（公开），
# 依赖镜像走 docker.m.daocloud.io 镜像站；fpk 内不再打包镜像文件，
# 飞牛安装时直接拉取（NAS 已验证 ghcr.io 与 daocloud 均可连通）。
# TV APK 自动绑定 fork 自己的最新 APK Release（Release 工作流出的 "Home KTV ..."），
# 没有才回落到上游 zhayinggang/ktv-home 的最新 Release；下载它的两个官方签名 APK 拷进镜像，管理后台就能提供电视端下载；
# fpk 版本号不填就默认跟上游最新版一致。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "fpk 版本号（写入 manifest，不填则跟上游最新版）"
        default: ""
        required: false
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve TV APK version
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 优先用 fork 自己的 APK Release（Release 工作流出的 "Home KTV ..." 正式版），没有才回落到上游
          TAG=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=20" --jq '.[] | select(.prerelease == false and (.name | startswith("Home KTV "))) | .tag_name' | head -n 1)
          if [ -n "$TAG" ]; then
            APK_REPO="$GITHUB_REPOSITORY"
          else
            TAG=$(gh api repos/zhayinggang/ktv-home/releases/latest --jq .tag_name)
            APK_REPO="zhayinggang/ktv-home"
          fi
          APK_VERSION="${TAG#v}"
          [ -n "$APK_VERSION" ] || (echo "取不到 TV APK 版本" && exit 1)
          echo "apk_version=$APK_VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk_repo=$APK_REPO" >> "$GITHUB_OUTPUT"
          echo "TV APK：$APK_REPO $TAG"

      - name: Resolve version
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
          fi
          VERSION="${VERSION#v}"
          [ -n "$VERSION" ] || VERSION="${{ steps.upstream.outputs.apk_version }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          sed -i "s/^version=.*/version=$VERSION/" packaging/fnos/manifest
          grep '^version=' packaging/fnos/manifest

      - name: Sync TV APKs from release
        run: |
          APK_VERSION="${{ steps.upstream.outputs.apk_version }}"
          APK_TAG="${{ steps.upstream.outputs.apk_tag }}"
          APK_REPO="${{ steps.upstream.outputs.apk_repo }}"
          mkdir -p dist/tv-apk
          cd dist/tv-apk
          curl -sSL -o "home-ktv-tv-${APK_VERSION}-armeabi-v7a.apk" \
            "https://github.com/${APK_REPO}/releases/download/${APK_TAG}/home-ktv-tv-${APK_VERSION}-armeabi-v7a.apk"
          curl -sSL -o "home-ktv-tv-${APK_VERSION}-arm64-v8a.apk" \
            "https://github.com/${APK_REPO}/releases/download/${APK_TAG}/home-ktv-tv-${APK_VERSION}-arm64-v8a.apk"
          ls -lh
          file home-ktv-tv-*.apk | grep -q "Android package" || (echo "APK 下载失败或不是有效安装包" && exit 1)

      - name: Build and push KTV image
        run: |
          VER="${{ steps.version.outputs.version }}"
          TAGS="-t ghcr.io/aeson70/ktv-home:latest -t ghcr.io/aeson70/ktv-home:${VER}"
          docker build \
            --build-arg BASE_REGISTRY=docker.io \
            --build-arg KTV_RELEASE_VERSION=${{ steps.upstream.outputs.apk_version }} \
            --build-arg KTV_RELEASE_VERSION_CODE=${{ github.run_number }} \
            -f backend/Dockerfile $TAGS .
          docker push ghcr.io/aeson70/ktv-home:latest
          docker push ghcr.io/aeson70/ktv-home:${VER}

      - name: Prepare fnpack (vendored, checksum verified)
        run: |
          echo "54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93  tools/fnpack-linux-amd64" | sha256sum -c -
          chmod +x tools/fnpack-linux-amd64
          cp tools/fnpack-linux-amd64 fnpack
          ./fnpack --help >/dev/null

      - name: Build fpk
        run: |
          ./fnpack build --directory packaging/fnos
          ls -lh ./*.fpk

      - name: Rename with version
        id: rename
        run: |
          ASSET="ktv-home-${{ steps.version.outputs.version }}-fnOS-x86.fpk"
          mv ktv-home.fpk "$ASSET"
          sha256sum "$ASSET" > "$ASSET.sha256"
          ls -lh "$ASSET" "$ASSET.sha256"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ktv-home-fpk
          path: |
            ${{ steps.rename.outputs.asset }}
            ${{ steps.rename.outputs.asset }}.sha256
          if-no-files-found: error

      - name: Attach to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 每次运行都发布到 Release（tag 用版本号）
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${{ steps.version.outputs.version }}"
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "ktv-home $TAG" --generate-notes
          # 重跑同版本时先清掉旧的 TV APK，避免新旧 APK 同时挂在 Release 里
          for asset in $(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq -r '.assets[] | select(.name | startswith("home-ktv-tv-")) | .name'); do
            gh release delete-asset "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" -y
          done
          gh release upload "$TAG" \
            "${{ steps.rename.outputs.asset }}" \
            "${{ steps.rename.outputs.asset }}.sha256" \
            "dist/tv-apk/home-ktv-tv-${{ steps.upstream.outputs.apk_version }}-armeabi-v7a.apk" \
            "dist/tv-apk/home-ktv-tv-${{ steps.upstream.outputs.apk_version }}-arm64-v8a.apk" \
            --repo "$GITHUB_REPOSITORY" --clobber
